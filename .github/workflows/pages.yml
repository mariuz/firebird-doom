name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Freedoom is BSD-licensed, so the site can ship it. Cache the trimmed
      # WAD so CI doesn't download 24 MB on every push.
      - name: Cache Freedoom
        id: wad
        uses: actions/cache@v4
        with:
          path: public/wads/
          key: freedoom1-0.13.0-${{ hashFiles('scripts/fetch-wad.mjs') }}

      - name: Fetch Freedoom
        if: steps.wad.outputs.cache-hit != 'true'
        run: npm run fetch-wad

      # Runs the game's SQL inside the real Firebird WASM engine under Node:
      # loads E1M1, walks, shoots, opens a door, renders frames, and checks
      # that the procedural and window-function clippers agree.
      - name: SQL smoke test
        run: npm test

      - name: Weapons, Phase 1 (fist to BFG, chainsaw)
        run: npm run test:weapons

      - name: Weapons, Phase 2 (adds the super shotgun)
        run: npm run test:weapons
        env:
          WAD: public/wads/freedoom2.wad

      - name: Specials, Phase 1 (hanging bodies, boss deaths)
        run: npm run test:specials

      - name: Specials, Phase 2 (Commander Keen, MAP07, the Icon of Sin)
        run: npm run test:specials
        env:
          WAD: public/wads/freedoom2.wad

      - name: Physics, Phase 1 (crushers, 3D projectile aiming)
        run: npm run test:physics

      - name: Physics, Phase 2 (adds a floor crusher)
        run: npm run test:physics
        env:
          WAD: public/wads/freedoom2.wad

      - name: DOOM II finale (story text, cast call)
        run: npm run test:finale

      - name: Intermission (kills, items, secrets, time, par)
        run: npm run test:intermission

      - name: Title screen and menus
        run: npm run test:menu

      - name: Save and load, Phase 1
        run: npm run test:savegame

      - name: Save and load, Phase 2
        run: npm run test:savegame
        env:
          WAD: public/wads/freedoom2.wad

      - name: Demos (determinism), Phase 1
        run: npm run test:demo

      - name: Demos (determinism), Phase 2
        run: npm run test:demo
        env:
          WAD: public/wads/freedoom2.wad

      - name: DEHACKED patches
        run: npm run test:dehacked

      - name: PWADs
        run: npm run test:pwad

      # BSP + solidsegs must find exactly the walls brute force finds
      - name: Renderer equivalence (BSP vs brute force)
        run: npm run test:renderers -- E1M1 E1M2 E1M3

      - name: Build site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
