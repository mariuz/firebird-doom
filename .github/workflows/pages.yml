name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # (ubuntu-24.04, not -latest: on 26.04 the pinned Playwright, 1.56, installs no browsers)
  # Every test (scripts/test-all.mjs) in three shares on runners of their own, side
  # by side: the SQL tests four at a time (the game's SQL in the real Firebird WASM
  # engine on both WADs, the screens, saves, demos, light, sound and music, the
  # BSP-vs-brute-force renderer check, the README's pictures pixel for pixel), and
  # each of the two browser tests alone (the built page in headless Chromium, and
  # co-op over WebRTC), which on a 4-core runner are the slow ones.
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        part: [sql, browser, coop]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Freedoom is BSD-licensed, so the site can ship it. Cache the trimmed
      # WAD so CI doesn't download 24 MB on every push.
      - name: Cache Freedoom
        id: wad
        uses: actions/cache@v4
        with:
          path: public/wads/
          key: freedoom1-0.13.0-${{ hashFiles('scripts/fetch-wad.mjs') }}

      - name: Fetch Freedoom
        if: steps.wad.outputs.cache-hit != 'true'
        run: npm run fetch-wad

      - name: Install Chromium
        if: matrix.part != 'sql'
        run: npx playwright install --with-deps chromium

      - name: Tests (npm run test:all -- --part=${{ matrix.part }})
        run: npm run test:all -- --part=${{ matrix.part }}

      - name: Upload the logs and the pictures that changed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.part }}
          path: |
            test-logs/
            screenshots-diff/
          if-no-files-found: ignore

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Freedoom
        id: wad
        uses: actions/cache@v4
        with:
          path: public/wads/
          key: freedoom1-0.13.0-${{ hashFiles('scripts/fetch-wad.mjs') }}

      - name: Fetch Freedoom
        if: steps.wad.outputs.cache-hit != 'true'
        run: npm run fetch-wad

      - name: Build site
        run: npm run build
        env:
          # the deployed netgame relay (worker/README.md), if the repository has one
          RELAY_URL: ${{ vars.RELAY_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
