name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Freedoom is BSD-licensed, so the site can ship it. Cache the trimmed
      # WAD so CI doesn't download 24 MB on every push.
      - name: Cache Freedoom
        id: wad
        uses: actions/cache@v4
        with:
          path: public/wads/
          key: freedoom1-0.13.0-${{ hashFiles('scripts/fetch-wad.mjs') }}

      - name: Fetch Freedoom
        if: steps.wad.outputs.cache-hit != 'true'
        run: npm run fetch-wad

      # Every test, four at a time (scripts/test-all.mjs): the game's SQL in the real
      # Firebird WASM engine on both WADs, the screens, saves, demos, light, sound
      # and music, the BSP-vs-brute-force renderer check, the README's pictures
      # pixel for pixel, and the built page in headless Chromium (the browser test
      # and co-op over WebRTC). Each test's output is in test-logs/.
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - name: Tests (npm run test:all)
        run: npm run test:all

      - name: Upload the logs and the pictures that changed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            test-logs/
            screenshots-diff/
          if-no-files-found: ignore

      - name: Build site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
