name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Freedoom is BSD-licensed, so the site can ship it. Cache the trimmed
      # WAD so CI doesn't download 24 MB on every push.
      - name: Cache Freedoom
        id: wad
        uses: actions/cache@v4
        with:
          path: public/wads/freedoom1.wad
          key: freedoom1-0.13.0-${{ hashFiles('scripts/fetch-wad.mjs') }}

      - name: Fetch Freedoom
        if: steps.wad.outputs.cache-hit != 'true'
        run: npm run fetch-wad

      # Runs the game's SQL inside the real Firebird WASM engine under Node:
      # loads E1M1, walks, shoots, opens a door, renders frames, and checks
      # that the procedural and window-function clippers agree.
      - name: SQL smoke test
        run: npm test

      - name: Build site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
